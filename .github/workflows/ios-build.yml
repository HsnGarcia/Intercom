name: Build iOS Unsigned IPA (MotoMesh)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS IPA on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Build iOS Release (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA for Sideloadly / AltStore
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r MotoMesh-unsigned.ipa Payload

      - name: Upload MotoMesh-unsigned.ipa
        uses: actions/upload-artifact@v4
        with:
          name: MotoMesh-unsigned-ipa
          path: MotoMesh-unsigned.ipa
