name: moto_mesh_intercom
description: Intercomunicador grupal offline para motociclistas compatible con cualquier casco Bluetooth (Android + iOS).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_blue_plus: ^1.32.12
  permission_handler: ^11.3.1
  udp: ^5.0.3
  network_info_plus: ^6.0.1
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
